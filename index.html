<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Ball Playground 198X</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at top, #2b1055 0%, #090014 45%, #04030c 100%);
      }

      #hud {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 20;
        background: rgba(7, 7, 24, 0.74);
        border: 1px solid rgba(56, 189, 248, 0.6);
        box-shadow: 0 0 18px rgba(244, 114, 182, 0.4);
        color: #dbeafe;
        padding: 0.9rem 1rem;
        border-radius: 10px;
        max-width: 390px;
        line-height: 1.35;
        font-size: 0.94rem;
      }

      #hud h1 {
        margin: 0 0 0.4rem;
        color: #f472b6;
        letter-spacing: 0.08em;
        text-shadow: 0 0 7px #f472b6;
        font-size: 1rem;
      }

      .stat-label {
        color: #67e8f9;
      }

      #message {
        margin-top: 0.45rem;
        color: #86efac;
        font-weight: bold;
        text-shadow: 0 0 7px rgba(134, 239, 172, 0.85);
      }

      #audioHint {
        margin-top: 0.35rem;
        color: #facc15;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>NEON BALL PLAYGROUND 198X</h1>
      <div>Controls: <strong>WASD</strong> or <strong>Arrow Keys</strong></div>
      <div>Collect all 10 coins. Use ramps to launch and boost pads for speed.</div>
      <div><span class="stat-label">Coins:</span> <span id="coins">0/10</span></div>
      <div><span class="stat-label">Time:</span> <span id="time">0.00s</span></div>
      <div><span class="stat-label">Score:</span> <span id="score">--</span></div>
      <div><span class="stat-label">Best:</span> <span id="best">--</span></div>
      <div id="message"></div>
      <div id="audioHint">Press any movement key to start music.</div>
    </div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x12001f, 0.0065);

      const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 420);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0x7dd3fc, 0x20003a, 0.62));
      const sunLight = new THREE.DirectionalLight(0xff8bdc, 1.12);
      sunLight.position.set(30, 38, 18);
      scene.add(sunLight);

      const horizonSun = new THREE.Mesh(
        new THREE.CircleGeometry(12, 64),
        new THREE.MeshBasicMaterial({ color: 0xff7eb6 })
      );
      horizonSun.position.set(-20, 18, -170);
      scene.add(horizonSun);

      const playgroundSize = 120;
      const wallLimit = playgroundSize / 2 - 1;

      const baseFloor = new THREE.Mesh(
        new THREE.PlaneGeometry(playgroundSize, playgroundSize),
        new THREE.MeshStandardMaterial({ color: 0x061024, roughness: 0.92, metalness: 0.04 })
      );
      baseFloor.rotation.x = -Math.PI / 2;
      scene.add(baseFloor);

      const grid = new THREE.GridHelper(playgroundSize, 60, 0xff4db8, 0x22d3ee);
      grid.position.y = 0.03;
      scene.add(grid);

      const lane = new THREE.Mesh(
        new THREE.PlaneGeometry(playgroundSize - 2, playgroundSize - 2),
        new THREE.MeshStandardMaterial({ color: 0x0d6b4b, roughness: 0.82, metalness: 0.03 })
      );
      lane.rotation.x = -Math.PI / 2;
      lane.position.y = 0.015;
      scene.add(lane);

      // Robust ramp model: every ramp has an explicit facing direction vector.
      const ramps = [
        { cx: -28, cz: 30, width: 10, length: 18, rise: 5.2, dir: [1, 0], color: 0x166534 },
        { cx: 24, cz: 28, width: 10, length: 18, rise: 4.4, dir: [-1, 0], color: 0x15803d },
        { cx: -8, cz: 0, width: 11, length: 20, rise: 6.2, dir: [0, -1], color: 0x166534 },
        { cx: 22, cz: -6, width: 9, length: 18, rise: 4.6, dir: [0, 1], color: 0x14532d },
        { cx: -30, cz: -24, width: 10, length: 18, rise: 5.0, dir: [1, 0], color: 0x15803d },
        { cx: 0, cz: -30, width: 12, length: 22, rise: 7.1, dir: [0, -1], color: 0x166534 },
        { cx: 30, cz: -32, width: 10, length: 18, rise: 5.0, dir: [-1, 0], color: 0x14532d },
        { cx: -2, cz: 42, width: 12, length: 20, rise: 6.6, dir: [0, 1], color: 0x166534 },
      ];

      function createRamp(ramp) {
        const [dx, dz] = ramp.dir;
        const len2 = Math.hypot(dx, dz);
        const dirX = dx / len2;
        const dirZ = dz / len2;
        const sideX = -dirZ;
        const sideZ = dirX;

        // World-space corners (bottom near edge to top far edge)
        const halfW = ramp.width / 2;
        const halfL = ramp.length / 2;

        const p0 = new THREE.Vector3(
          ramp.cx - dirX * halfL - sideX * halfW,
          0,
          ramp.cz - dirZ * halfL - sideZ * halfW
        );
        const p1 = new THREE.Vector3(
          ramp.cx - dirX * halfL + sideX * halfW,
          0,
          ramp.cz - dirZ * halfL + sideZ * halfW
        );
        const p2 = new THREE.Vector3(
          ramp.cx + dirX * halfL - sideX * halfW,
          ramp.rise,
          ramp.cz + dirZ * halfL - sideZ * halfW
        );
        const p3 = new THREE.Vector3(
          ramp.cx + dirX * halfL + sideX * halfW,
          ramp.rise,
          ramp.cz + dirZ * halfL + sideZ * halfW
        );

        const geometry = new THREE.BufferGeometry();
        const vertices = new Float32Array([
          p0.x, p0.y, p0.z,
          p1.x, p1.y, p1.z,
          p2.x, p2.y, p2.z,
          p2.x, p2.y, p2.z,
          p1.x, p1.y, p1.z,
          p3.x, p3.y, p3.z,
        ]);
        geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
        geometry.computeVertexNormals();

        const mesh = new THREE.Mesh(
          geometry,
          new THREE.MeshStandardMaterial({ color: ramp.color, roughness: 0.68, metalness: 0.08, side: THREE.DoubleSide })
        );
        mesh.position.y = 0.06;
        scene.add(mesh);

        const edge = new THREE.Mesh(
          new THREE.BoxGeometry(ramp.width, 0.12, 0.2),
          new THREE.MeshStandardMaterial({ color: 0xf0abfc, emissive: 0xdb2777, emissiveIntensity: 0.45 })
        );
        edge.position.set(ramp.cx + dirX * halfL, ramp.rise + 0.12, ramp.cz + dirZ * halfL);
        edge.rotation.y = Math.atan2(sideX, sideZ);
        scene.add(edge);

        return {
          cx: ramp.cx,
          cz: ramp.cz,
          width: ramp.width,
          length: ramp.length,
          rise: ramp.rise,
          dirX,
          dirZ,
          sideX,
          sideZ,
          halfW,
          halfL,
        };
      }

      const rampPhysics = ramps.map(createRamp);

      const boostPads = [
        { x: -42, z: 32, r: 2.2, boost: 13.5 },
        { x: -5, z: 20, r: 2.1, boost: 13.5 },
        { x: 35, z: 10, r: 2.0, boost: 14 },
        { x: -22, z: -5, r: 2.2, boost: 15 },
        { x: 15, z: -28, r: 1.9, boost: 14.5 },
        { x: -38, z: -34, r: 2.3, boost: 15.5 },
      ];

      boostPads.forEach((pad) => {
        const mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(pad.r, pad.r, 0.25, 28),
          new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xbe185d, emissiveIntensity: 1.15 })
        );
        mesh.position.set(pad.x, 0.14, pad.z);
        scene.add(mesh);
      });

      const obstacles = [
        { x: -14, z: 28, w: 4, d: 2.5, h: 3.1 },
        { x: 8, z: 26, w: 2.4, d: 5, h: 2.4 },
        { x: 18, z: -2, w: 4.4, d: 2.4, h: 2.7 },
        { x: -28, z: -10, w: 3.2, d: 3.2, h: 2.8 },
        { x: 30, z: -18, w: 3.6, d: 2.1, h: 3.3 },
        { x: -8, z: -38, w: 5, d: 2.2, h: 3.2 },
      ];

      obstacles.forEach((o) => {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(o.w, o.h, o.d),
          new THREE.MeshStandardMaterial({ color: 0x1d4ed8, emissive: 0x312e81, emissiveIntensity: 0.55 })
        );
        mesh.position.set(o.x, o.h / 2 + 0.1, o.z);
        scene.add(mesh);
      });

      const coinPositions = [
        [-44, 40], [-18, 42], [9, 42], [34, 34], [42, 8], [28, -18], [3, -40], [-20, -38], [-44, -24], [-4, -4],
      ];

      const coins = coinPositions.map(([x, z]) => {
        const mesh = new THREE.Mesh(
          new THREE.TorusGeometry(1.05, 0.28, 12, 28),
          new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xf59e0b, emissiveIntensity: 0.7, metalness: 0.55, roughness: 0.35 })
        );
        mesh.position.set(x, 1.35, z);
        mesh.rotation.x = Math.PI / 2;
        scene.add(mesh);
        return { mesh, x, z, collected: false };
      });

      const ballRadius = 0.55;
      const ball = new THREE.Mesh(
        new THREE.SphereGeometry(ballRadius, 44, 44),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.11 })
      );
      ball.position.set(0, ballRadius, 50);
      scene.add(ball);

      const trailLight = new THREE.PointLight(0x7dd3fc, 0.85, 19);
      scene.add(trailLight);

      const keys = {};
      const velocity = new THREE.Vector3();
      const controlAccel = 42;
      const gravity = 24;
      const groundFriction = 2.5;
      const airDrag = 0.21;
      const bounce = 0.43;
      const maxSpeed = 36;
      const slopeForce = 30;
      let grounded = true;
      let audioStarted = false;
      let startTime = performance.now();
      let elapsed = 0;
      let won = false;
      let bestTime = Number.POSITIVE_INFINITY;
      let lastBoostTime = -10;
      let collectedCoins = 0;

      const coinsEl = document.getElementById("coins");
      const timeEl = document.getElementById("time");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const message = document.getElementById("message");
      const audioHint = document.getElementById("audioHint");
      const clock = new THREE.Clock();

      function getTerrain(x, z) {
        let bestHeight = 0;
        let gradX = 0;
        let gradZ = 0;

        for (const ramp of rampPhysics) {
          const relX = x - ramp.cx;
          const relZ = z - ramp.cz;
          const along = relX * ramp.dirX + relZ * ramp.dirZ;
          const across = relX * ramp.sideX + relZ * ramp.sideZ;

          if (Math.abs(across) > ramp.halfW || Math.abs(along) > ramp.halfL) continue;

          const t = (along + ramp.halfL) / ramp.length;
          const h = ramp.rise * t;

          if (h >= bestHeight) {
            bestHeight = h;
            gradX = (ramp.rise / ramp.length) * ramp.dirX;
            gradZ = (ramp.rise / ramp.length) * ramp.dirZ;
          }
        }

        return { height: bestHeight, gradX, gradZ };
      }

      function resolveObstacleCollisions() {
        const yFloor = ball.position.y - ballRadius;
        obstacles.forEach((o) => {
          if (yFloor > o.h + 0.2) return;

          const minX = o.x - o.w / 2 - ballRadius;
          const maxX = o.x + o.w / 2 + ballRadius;
          const minZ = o.z - o.d / 2 - ballRadius;
          const maxZ = o.z + o.d / 2 + ballRadius;

          if (ball.position.x < minX || ball.position.x > maxX || ball.position.z < minZ || ball.position.z > maxZ) return;

          const penLeft = Math.abs(ball.position.x - minX);
          const penRight = Math.abs(maxX - ball.position.x);
          const penTop = Math.abs(maxZ - ball.position.z);
          const penBottom = Math.abs(ball.position.z - minZ);
          const minPen = Math.min(penLeft, penRight, penTop, penBottom);

          if (minPen === penLeft) {
            ball.position.x = minX;
            velocity.x = -Math.abs(velocity.x) * bounce;
          } else if (minPen === penRight) {
            ball.position.x = maxX;
            velocity.x = Math.abs(velocity.x) * bounce;
          } else if (minPen === penTop) {
            ball.position.z = maxZ;
            velocity.z = Math.abs(velocity.z) * bounce;
          } else {
            ball.position.z = minZ;
            velocity.z = -Math.abs(velocity.z) * bounce;
          }
        });
      }

      function applyBoosts(nowSeconds) {
        for (const pad of boostPads) {
          const dx = ball.position.x - pad.x;
          const dz = ball.position.z - pad.z;
          const dist = Math.hypot(dx, dz);
          if (dist < pad.r + ballRadius * 0.45 && nowSeconds - lastBoostTime > 0.2) {
            const horizontal = new THREE.Vector2(velocity.x, velocity.z);
            const dir = horizontal.lengthSq() > 0.01 ? horizontal.normalize() : new THREE.Vector2(0, -1);
            velocity.x += dir.x * pad.boost;
            velocity.z += dir.y * pad.boost;
            velocity.y += 1.5;
            lastBoostTime = nowSeconds;
          }
        }
      }

      function collectCoins() {
        for (const coin of coins) {
          if (coin.collected) continue;
          const dx = ball.position.x - coin.x;
          const dz = ball.position.z - coin.z;
          if (Math.hypot(dx, dz) < 1.7) {
            coin.collected = true;
            coin.mesh.visible = false;
            collectedCoins += 1;
            coinsEl.textContent = `${collectedCoins}/10`;
          }
        }
      }

      function startMusic() {
        if (audioStarted) return;
        audioStarted = true;
        audioHint.textContent = "Synth groove online.";

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const master = ctx.createGain();
        master.gain.value = 0.05;
        master.connect(ctx.destination);

        const bassFreqs = [82.41, 98.0, 110.0, 98.0, 123.47, 110.0, 98.0, 82.41];
        let step = 0;
        const playStep = () => {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          const amp = ctx.createGain();

          osc.type = "sawtooth";
          osc.frequency.value = bassFreqs[step % bassFreqs.length];
          lfo.type = "square";
          lfo.frequency.value = 8;
          lfoGain.gain.value = 9;

          amp.gain.setValueAtTime(0.0001, now);
          amp.gain.exponentialRampToValueAtTime(0.12, now + 0.015);
          amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.33);

          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);
          osc.connect(amp);
          amp.connect(master);

          osc.start(now);
          lfo.start(now);
          osc.stop(now + 0.34);
          lfo.stop(now + 0.34);
          step += 1;
        };

        playStep();
        setInterval(playStep, 350);
      }

      window.addEventListener("keydown", (event) => {
        keys[event.key.toLowerCase()] = true;
        if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(event.key.toLowerCase())) {
          startMusic();
        }
      });

      window.addEventListener("keyup", (event) => {
        keys[event.key.toLowerCase()] = false;
      });

      function updatePhysics(dt) {
        if (won) return;

        const move = new THREE.Vector2(0, 0);
        if (keys["w"] || keys["arrowup"]) move.y -= 1;
        if (keys["s"] || keys["arrowdown"]) move.y += 1;
        if (keys["a"] || keys["arrowleft"]) move.x -= 1;
        if (keys["d"] || keys["arrowright"]) move.x += 1;
        if (move.lengthSq() > 0) {
          move.normalize();
          velocity.x += move.x * controlAccel * dt;
          velocity.z += move.y * controlAccel * dt;
        }

        const terrainBefore = getTerrain(ball.position.x, ball.position.z);

        if (grounded) {
          velocity.x += -terrainBefore.gradX * slopeForce * dt;
          velocity.z += -terrainBefore.gradZ * slopeForce * dt;

          const horizontalSpeed = Math.hypot(velocity.x, velocity.z);
          if (horizontalSpeed > 0) {
            const decel = Math.max(
              0,
              horizontalSpeed - groundFriction * dt * (1 + Math.abs(terrainBefore.gradX) + Math.abs(terrainBefore.gradZ))
            );
            velocity.x *= decel / horizontalSpeed;
            velocity.z *= decel / horizontalSpeed;
          }

          // slope contributes to take-off velocity on ramp exits
          velocity.y = velocity.x * terrainBefore.gradX + velocity.z * terrainBefore.gradZ;
        } else {
          velocity.x *= Math.max(0, 1 - airDrag * dt);
          velocity.z *= Math.max(0, 1 - airDrag * dt);
          velocity.y -= gravity * dt;
        }

        const hSpeed = Math.hypot(velocity.x, velocity.z);
        if (hSpeed > maxSpeed) {
          const s = maxSpeed / hSpeed;
          velocity.x *= s;
          velocity.z *= s;
        }

        ball.position.x += velocity.x * dt;
        ball.position.y += velocity.y * dt;
        ball.position.z += velocity.z * dt;

        if (ball.position.x > wallLimit) {
          ball.position.x = wallLimit;
          velocity.x *= -bounce;
        } else if (ball.position.x < -wallLimit) {
          ball.position.x = -wallLimit;
          velocity.x *= -bounce;
        }

        if (ball.position.z > wallLimit) {
          ball.position.z = wallLimit;
          velocity.z *= -bounce;
        } else if (ball.position.z < -wallLimit) {
          ball.position.z = -wallLimit;
          velocity.z *= -bounce;
        }

        resolveObstacleCollisions();

        const terrainAfter = getTerrain(ball.position.x, ball.position.z);
        const groundY = terrainAfter.height + ballRadius;

        if (ball.position.y <= groundY) {
          ball.position.y = groundY;
          if (velocity.y < 0) velocity.y = 0;
          grounded = true;
        } else {
          grounded = false;
        }

        applyBoosts(performance.now() / 1000);
        collectCoins();

        const rollAxis = new THREE.Vector3(velocity.z, 0, -velocity.x).normalize();
        if (hSpeed > 0.001 && Number.isFinite(rollAxis.x)) {
          ball.rotateOnWorldAxis(rollAxis, (hSpeed * dt) / ballRadius);
        }

        if (collectedCoins === 10) {
          won = true;
          const finalTime = elapsed;
          const score = Math.max(0, Math.round(22000 / Math.max(finalTime, 0.1)));
          scoreEl.textContent = String(score);
          message.textContent = `All coins collected in ${finalTime.toFixed(2)}s!`;
          if (finalTime < bestTime) {
            bestTime = finalTime;
            bestEl.textContent = `${bestTime.toFixed(2)}s`;
          }
        }
      }

      function updateHud() {
        if (won) return;
        elapsed = (performance.now() - startTime) / 1000;
        timeEl.textContent = `${elapsed.toFixed(2)}s`;
        scoreEl.textContent = String(Math.max(0, Math.round(22000 / Math.max(elapsed, 0.15))));
      }

      function animateCoins(timeSec) {
        for (const coin of coins) {
          if (!coin.collected) {
            coin.mesh.rotation.z += 0.04;
            coin.mesh.position.y = 1.35 + Math.sin(timeSec * 2.8 + coin.x * 0.12 + coin.z * 0.07) * 0.18;
          }
        }
      }

      function updateCamera() {
        const speedFactor = THREE.MathUtils.clamp(Math.hypot(velocity.x, velocity.z) / maxSpeed, 0, 1);
        const desired = new THREE.Vector3(
          ball.position.x,
          16 + speedFactor * 6 + ball.position.y * 0.12,
          ball.position.z + 22 + speedFactor * 10
        );
        camera.position.lerp(desired, 0.07);
        camera.lookAt(ball.position.x, ball.position.y * 0.45, ball.position.z - 2);
        trailLight.position.set(ball.position.x, ball.position.y + 2, ball.position.z + 1.2);
      }

      function animate() {
        const dt = Math.min(clock.getDelta(), 1 / 30);
        updatePhysics(dt);
        updateHud();
        updateCamera();

        const t = performance.now() * 0.001;
        animateCoins(t);

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
